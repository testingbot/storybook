name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC). No NPM_TOKEN secret is used;
      # npm verifies this workflow's identity against the trusted publisher
      # configured for @testingbot/storybook on npmjs.com.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer; the npm bundled with
      # Node 20 is older than that.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # access and provenance come from publishConfig in package.json.
      - run: npm publish
