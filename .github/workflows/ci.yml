name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Both ends of the range package.json claims to support, so "engines"
        # is something CI checks rather than something we hope is true.
        node-version: [20, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # npm runs scripts with sh, where "**" is just "*", so the test script
      # globs one flat directory. A test file in a subdirectory would not run
      # and nothing would say so, which is the same silent pass this addon
      # exists to avoid.
      - name: No test file hides in a subdirectory
        run: |
          nested=$(find test -mindepth 2 -name '*.test.js')
          if [ -n "$nested" ]; then
            echo "These test files are not run by \"npm test\":"
            echo "$nested"
            exit 1
          fi

      # The surface tests assert that the experimental Storybook APIs this addon
      # depends on still exist. Run them against the newest Storybook 10 as well
      # as the pinned one, so an upstream removal shows up here rather than in a
      # user's Storybook.
      - name: Re-verify addon surfaces against latest Storybook 10
        continue-on-error: true
        run: |
          npm install --no-save storybook@^10
          npm test
